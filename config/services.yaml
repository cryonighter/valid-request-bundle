services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Cryonighter\ValidRequestBundle\:
        resource: '../src/'
        exclude:
            - '../src/Attribute'
            - '../src/Enum'
            - '../src/functions.php'

    Cryonighter\ValidRequestBundle\Schema\SchemaFactory:
        arguments:
            $cacheDir: '%kernel.cache_dir%/valid_request_schema'
            $debug: '%kernel.debug%'
